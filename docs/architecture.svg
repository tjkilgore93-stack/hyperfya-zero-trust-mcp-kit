<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fca5a5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="430" fill="#0f172a"/>

  <!-- MCP clients -->
  <rect x="20" y="60" width="170" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="38" y="86" fill="#e2e8f0" font-size="13">Claude / Cursor</text>
  <text x="38" y="104" fill="#94a3b8" font-size="11">MCP client — tenant A</text>

  <rect x="20" y="160" width="170" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="38" y="186" fill="#e2e8f0" font-size="13">Other client</text>
  <text x="38" y="204" fill="#94a3b8" font-size="11">MCP client — tenant B</text>

  <!-- Gateway -->
  <rect x="270" y="60" width="210" height="170" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="290" y="88" fill="#e2e8f0" font-size="13">MCP gateway (Node)</text>
  <text x="290" y="114" fill="#94a3b8" font-size="11">1. Bearer token in</text>
  <text x="290" y="130" fill="#94a3b8" font-size="11">Authorization header</text>
  <text x="290" y="152" fill="#94a3b8" font-size="11">2. SHA-256 lookup:</text>
  <text x="290" y="168" fill="#94a3b8" font-size="11">token to tenant id</text>
  <text x="290" y="190" fill="#94a3b8" font-size="11">3. tenant id is bound</text>
  <text x="290" y="206" fill="#94a3b8" font-size="11">into the request — never</text>
  <text x="290" y="222" fill="#94a3b8" font-size="11">a tool argument</text>

  <!-- Postgres -->
  <rect x="580" y="60" width="280" height="170" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="600" y="88" fill="#e2e8f0" font-size="13">Postgres (RLS)</text>
  <text x="600" y="114" fill="#94a3b8" font-size="11">BEGIN; SET LOCAL app.tenant_id;</text>
  <text x="600" y="130" fill="#94a3b8" font-size="11">every query scoped by policy:</text>
  <text x="600" y="146" fill="#94a3b8" font-size="11">tenant_id = current_setting(...)</text>
  <text x="600" y="172" fill="#34d399" font-size="11">tenant A rows: visible</text>
  <text x="600" y="190" fill="#fca5a5" font-size="11">tenant B rows: invisible</text>

  <!-- arrows -->
  <line x1="190" y1="92" x2="258" y2="115" stroke="#7dd3fc" stroke-width="2"/>
  <polygon points="262,115 250,109 252,120" fill="#7dd3fc"/>
  <line x1="190" y1="192" x2="258" y2="185" stroke="#7dd3fc" stroke-width="2"/>
  <polygon points="262,185 250,179 252,192" fill="#7dd3fc"/>
  <line x1="480" y1="172" x2="566" y2="172" stroke="#7dd3fc" stroke-width="2"/>
  <polygon points="574,172 560,166 560,178" fill="#7dd3fc"/>
  <text x="490" y="190" fill="#7dd3fc" font-size="11">SQL, role mcp_app</text>

  <!-- cross-tenant attempt -->
  <rect x="270" y="290" width="280" height="80" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text x="290" y="318" fill="#e2e8f0" font-size="13">Cross-tenant query</text>
  <text x="290" y="340" fill="#94a3b8" font-size="11">RLS filters it out in the database:</text>
  <text x="290" y="356" fill="#fca5a5" font-size="11">zero rows, no error, every time</text>
  <line x1="390" y1="288" x2="390" y2="240" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="390,232 384,244 396,244" fill="#fca5a5"/>

  <!-- footer -->
  <text x="20" y="410" fill="#7dd3fc" font-size="12">docker compose up  →  postgres (schema + RLS policies) + gateway on :3000/mcp</text>
</svg>
